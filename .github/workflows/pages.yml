name: pages

# Builds the photo files from the originals on lucasiletti.com, assembles the
# static site and deploys it to GitHub Pages. Runs on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore photo files from cache
        uses: actions/cache@v4
        with:
          path: img
          key: img-v1-${{ hashFiles('tools/build-images.mjs') }}
      - name: Build photo files (900 / 1200 / 2000 px WebP)
        run: |
          npm --prefix tools install --no-audit --no-fund
          node tools/build-images.mjs
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r img _site/img
          ls _site/img | wc -l
          du -sh _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
