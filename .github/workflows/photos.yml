name: photos

# Generates img/*.webp from the originals on lucasiletti.com and switches the
# site to local image mode. Runs once on the first push; re-run it by hand if
# a photo changes. Its own commit does not retrigger it (GITHUB_TOKEN pushes
# never start workflows).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: photos
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[photos]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build WebP files
        run: |
          npm --prefix tools install --no-audit --no-fund
          node tools/build-images.mjs
      - name: Commit the files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Add local photo files, switch to local image mode [photos]"
            git push
            # A push made with GITHUB_TOKEN does not start the Pages build by itself, so ask for one.
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Pages build request skipped (Pages not enabled yet?)"
          else
            echo "nothing to commit"
          fi
